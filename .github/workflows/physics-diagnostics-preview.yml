name: Windows physics diagnostics preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preview:
    name: Build Windows x64 preview
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Fetch pinned Arc
      shell: bash
      run: git init ../Arc && git -C ../Arc fetch --depth=1 https://github.com/Anuken/Arc 7445105cd2683daf5b9ac7033ebb07265d3e814d && git -C ../Arc checkout --detach FETCH_HEAD
    - uses: dtolnay/rust-toolchain@stable
    - name: Test and build native library
      shell: bash
      run: |
        cargo test --manifest-path native/pathfinding/Cargo.toml
        cargo build --manifest-path native/pathfinding/Cargo.toml --release
        mkdir -p desktop/src/main/resources/native/windows-x86_64
        cp native/pathfinding/target/release/mindustry_pathfinding.dll desktop/src/main/resources/native/windows-x86_64/
    - uses: gradle/actions/setup-gradle@v6
    - name: Build preview JAR
      shell: bash
      run: ./gradlew desktop:dist -Pbuildversion=1.1 -PdistributionVersion=1.1-physics-preview -PnativePhysicsDefault=true --stacktrace
    - name: Package preview with Java
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build/package/Mindustry | Out-Null
        Copy-Item desktop/build/libs/Mindustry.jar build/package/Mindustry/
        Copy-Item packaging/windows/Start-Mindustry.bat build/package/Mindustry/
        jlink --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --compress=2 --output build/package/Mindustry/jre
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (Test-Path build/package/Mindustry/jre/bin/javaw.exe)) { throw 'javaw.exe missing' }
    - name: Verify packaged native physics and diagnostics
      shell: bash
      env:
        PLATFORM: windows
        EXPECTED_DISTRIBUTION_VERSION: 1.1-physics-preview
      run: python3 packaging/verify_native_physics.py
    - name: Upload preview (not a release)
      uses: actions/upload-artifact@v7
      with:
        name: Mindustry-physics-diagnostics-preview-Windows-x64
        path: build/package/Mindustry/
        if-no-files-found: error
        retention-days: 14
