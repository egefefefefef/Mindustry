name: Tests

on:
  push:
  workflow_dispatch:
    inputs:
      publish_windows:
        description: Build and publish the Windows ZIP with a bundled Java runtime
        type: boolean
        default: false
      publish_release:
        description: Publish the tested JARs as a GitHub prerelease
        type: boolean
        default: false

permissions: {}
jobs:
  runPush:
    permissions:
      contents: write # for Update bundles

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Trigger BE build
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        git clone --depth=1 --branch=master https://github.com/Anuken/MindustryBuilds ../MindustryBuilds
        cd ../MindustryBuilds
        BNUM=$(($GITHUB_RUN_NUMBER + 20000))
        git tag ${BNUM}
        git config --global user.name "Github Actions"
        git push https://Anuken:${{ secrets.API_TOKEN_GITHUB }}@github.com/Anuken/MindustryBuilds ${BNUM}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Fetch latest Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Update bundles
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        ./gradlew -DcompileMethodParams updateBundles

        if [ -n "$(git status --porcelain)" ]; then
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add core/assets/bundles/*
          git commit -m "Automatic bundle update"
          git push
        fi
    - name: Update scripts, class mappings and map names
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        ./gradlew -DcompileMethodParams updateScripts fixMaps

        if [ -n "$(git status --porcelain)" ]; then
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add core/assets/scripts/* core/src/mindustry/mod/ClassMap.java
          git add core/assets/maps/*
          git commit -m "Automatic class mapping and map name update"
          git push
        fi
    - name: Build and test
      uses: ./.github/actions/build-and-test
    - name: Publish tested JARs as a prerelease
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="ci-${GITHUB_SHA:0:12}"
        gh release create "$tag" \
          desktop/build/libs/Mindustry.jar \
          server/build/libs/server-release.jar \
          --target "$GITHUB_SHA" \
          --title "CI build ${GITHUB_SHA:0:12}" \
          --notes "Tested desktop and server JARs. The desktop JAR includes the native Rust pathfinder for Linux x86-64; other platforms use the Java fallback. This is not a full platform release." \
          --prerelease

  windowsPackage:
    name: Windows package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_windows }}
    needs: runPush
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Fetch Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - uses: dtolnay/rust-toolchain@stable
    - name: Build Windows native pathfinder
      shell: pwsh
      run: |
        cargo test --manifest-path native/pathfinding/Cargo.toml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo build --manifest-path native/pathfinding/Cargo.toml --release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force desktop/src/main/resources/native/windows-x86_64 | Out-Null
        Copy-Item native/pathfinding/target/release/mindustry_pathfinding.dll desktop/src/main/resources/native/windows-x86_64/
    - uses: gradle/actions/setup-gradle@v6
    - name: Build desktop JAR
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        .\gradlew.bat desktop:dist --stacktrace *>&1 | Tee-Object -FilePath windows-gradle.log
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          $message = ((Get-Content windows-gradle.log -Tail 100) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error::Windows Gradle build failed. $message"
          exit $code
        }
        if (-not (Test-Path desktop/build/libs/Mindustry.jar)) { throw 'Desktop JAR was not created' }
    - name: Upload Windows build log
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: windows-build-log
        path: windows-gradle.log
        if-no-files-found: ignore
    - name: Create Windows folder and bundled runtime
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build/package/Mindustry | Out-Null
        Copy-Item desktop/build/libs/Mindustry.jar build/package/Mindustry/Mindustry.jar
        Copy-Item packaging/windows/Start-Mindustry.bat build/package/Mindustry/Start-Mindustry.bat
        jlink --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --compress=2 --output build/package/Mindustry/jre
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & build/package/Mindustry/jre/bin/java.exe -version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (Test-Path build/package/Mindustry/jre/bin/javaw.exe)) { throw 'javaw.exe missing from runtime' }
        $entries = jar tf build/package/Mindustry/Mindustry.jar
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ($entries -cnotcontains 'native/windows-x86_64/mindustry_pathfinding.dll') { throw 'Native Windows pathfinder missing from JAR' }
        Compress-Archive -Path build/package/Mindustry -DestinationPath build/Mindustry-Windows-x64.zip
    - name: Upload Windows package artifact
      uses: actions/upload-artifact@v7
      with:
        name: mindustry-windows-x64
        path: build/Mindustry-Windows-x64.zip
        if-no-files-found: error
    - name: Publish Windows package
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = 'ci-' + $env:GITHUB_SHA.Substring(0, 12)
        gh release view $tag --json tagName 2>$null | Out-Null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag build/Mindustry-Windows-x64.zip --clobber
        } else {
          gh release create $tag build/Mindustry-Windows-x64.zip --target $env:GITHUB_SHA --title "Windows build $($env:GITHUB_SHA.Substring(0, 12))" --notes "Windows x64: unpack the ZIP and run Start-Mindustry.bat. Java is included in the jre folder." --prerelease
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
