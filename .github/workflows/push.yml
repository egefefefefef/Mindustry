name: Tests
on:
  push:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run synthetic pathfinding and physics benchmarks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Fetch Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - uses: gradle/actions/setup-gradle@v6
    - uses: ./.github/actions/build-and-test

  benchmark:
    name: Pathfinding and physics benchmarks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_benchmarks }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Fetch pinned Arc
      run: |
        git init ../Arc
        git -C ../Arc fetch --depth=1 https://github.com/Anuken/Arc 7445105cd2683daf5b9ac7033ebb07265d3e814d
        git -C ../Arc checkout --detach FETCH_HEAD
    - uses: dtolnay/rust-toolchain@stable
    - name: Test and build native pathfinder
      run: |
        cargo test --manifest-path native/pathfinding/Cargo.toml
        cargo build --manifest-path native/pathfinding/Cargo.toml --release
        mkdir -p desktop/src/main/resources/native/linux-x86_64
        cp native/pathfinding/target/release/libmindustry_pathfinding.so desktop/src/main/resources/native/linux-x86_64/
    - uses: gradle/actions/setup-gradle@v6
    - name: Measure pathfinding and physics
      shell: bash
      run: |
        mkdir -p build/performance
        set -o pipefail
        ./gradlew desktop:performanceBenchmark --stacktrace 2>&1 | tee build/performance/benchmark.log || {
          python3 -c 'import pathlib; s=pathlib.Path("build/performance/benchmark.log").read_text(errors="replace"); lines=s.splitlines(); relevant=[l for l in lines if any(x in l for x in ("error:", "Exception", "FAILED", "What went wrong", "Caused by"))]; msg="\n".join(relevant[-30:])[-10000:]; print("::error::"+msg.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
        }
    - name: Publish benchmark summary
      shell: bash
      run: |
        {
          echo "Source commit: $GITHUB_SHA"
          echo "Runner: $(uname -smr)"
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          echo "Logical CPUs: $(nproc)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Rust: $(rustc --version)"
          echo
          cat build/performance/results.md
        } > build/performance/summary.md
        cat build/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
        while IFS= read -r line; do
          if [[ "$line" == '| weighted'* || "$line" == '| physics'* ]]; then
            echo "::notice::$line"
          fi
        done < build/performance/results.md
    - name: Upload benchmark results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: pathfinding-physics-benchmark
        path: build/performance/
        if-no-files-found: warn
