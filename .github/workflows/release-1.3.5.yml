name: Mindustry v1.3.5 Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Fetch pinned Arc
      run: git init ../Arc && git -C ../Arc fetch --depth=1 https://github.com/Anuken/Arc 7445105cd2683daf5b9ac7033ebb07265d3e814d && git -C ../Arc checkout --detach FETCH_HEAD
    - uses: gradle/actions/setup-gradle@v6
    - uses: ./.github/actions/build-and-test

  windows:
    name: Build and publish Windows x64
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Fetch pinned Arc
      shell: bash
      run: git init ../Arc && git -C ../Arc fetch --depth=1 https://github.com/Anuken/Arc 7445105cd2683daf5b9ac7033ebb07265d3e814d && git -C ../Arc checkout --detach FETCH_HEAD
    - uses: dtolnay/rust-toolchain@stable
    - name: Test and build native library
      shell: bash
      run: |
        cargo test --manifest-path native/pathfinding/Cargo.toml
        cargo build --manifest-path native/pathfinding/Cargo.toml --release
        mkdir -p desktop/src/main/resources/native/windows-x86_64
        cp native/pathfinding/target/release/mindustry_pathfinding.dll desktop/src/main/resources/native/windows-x86_64/
    - uses: gradle/actions/setup-gradle@v6
    - name: Build versioned desktop JAR
      shell: bash
      run: ./gradlew desktop:dist -Pbuildversion=1.3.5 -PdistributionVersion=1.3.5 -PnativePhysicsDefault=true --stacktrace
    - name: Package Windows with Java
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build/package/Mindustry | Out-Null
        Copy-Item desktop/build/libs/Mindustry.jar build/package/Mindustry/
        Copy-Item packaging/windows/Start-Mindustry.bat build/package/Mindustry/
        jlink --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --compress=2 --output build/package/Mindustry/jre
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (Test-Path build/package/Mindustry/jre/bin/javaw.exe)) { throw 'javaw.exe missing' }
    - name: Verify bundled cave worker launches
      shell: bash
      run: |
        set +e
        output=$(build/package/Mindustry/jre/bin/java.exe -cp build/package/Mindustry/Mindustry.jar mindustry.server.CavePersistentService 2>&1)
        status=$?
        set -e
        echo "$output"
        test "$status" -eq 2
        [[ "$output" == *'Usage: CavePersistentService'* ]]
    - name: Verify packaged native physics and diagnostics
      shell: bash
      env:
        PLATFORM: windows
        EXPECTED_DISTRIBUTION_VERSION: 1.3.5
      run: python3 packaging/verify_native_physics.py
    - name: Create release archive
      shell: pwsh
      run: |
        Compress-Archive -Path build/package/Mindustry -DestinationPath build/Mindustry-v1.3.5-Windows-x64.zip
        if (-not (Test-Path build/Mindustry-v1.3.5-Windows-x64.zip)) { throw 'Archive missing' }
    - name: Verify archive and publish release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import zipfile
        path = 'build/Mindustry-v1.3.5-Windows-x64.zip'
        with zipfile.ZipFile(path) as z:
            assert z.testzip() is None
            names = {n.replace('\\', '/') for n in z.namelist()}
            for required in ('Mindustry/Mindustry.jar', 'Mindustry/Start-Mindustry.bat', 'Mindustry/jre/bin/javaw.exe'):
                assert required in names, required
        PY
        if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3.5" > /dev/null 2>&1; then
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/v1.3.5" --jq .sha)
          test "$tagged" = "$GITHUB_SHA" || { echo '::error::Existing v1.3.5 tag points to a different commit'; exit 1; }
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v1.3.5 -f sha="$GITHUB_SHA" > /dev/null
        fi
        if gh release view v1.3.5 > /dev/null 2>&1; then
          echo '::error::A v1.3.5 release already exists; refusing to overwrite it.'
          exit 1
        fi
        cat > release-notes.md <<'NOTES'
        # Mindustry v1.3.5

        Unofficial Windows x64 build with Java included. Extract the ZIP and run `Start-Mindustry.bat`.

        - Experimental local custom-game caves, with shared core storage and an optional full Java background simulation.
        - New ruby ore, ruby drill and ruby conveyor. The ruby drill has been rebalanced; the conveyor is faster than titanium.
        - Ruby appears in newly generated caves only; existing saved caves are not regenerated.
        - Includes the experimental weather, Rust physics and performance diagnostics from earlier versions.

        Enable caves under Settings → Experimental features and in custom-game rules. Caves are experimental, single-player only and unavailable in campaign, multiplayer and the editor. Full background simulation may stall the game. Back up saves. Automated tests and packaging checks passed; the graphical launch was not tested in CI. This release contains only the Windows x64 build.
        NOTES
        gh release create v1.3.5 --verify-tag --draft --title 'Mindustry v1.3.5' --notes-file release-notes.md build/Mindustry-v1.3.5-Windows-x64.zip
        gh release edit v1.3.5 --draft=false --prerelease=false --latest
