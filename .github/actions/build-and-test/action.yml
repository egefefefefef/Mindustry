name: Build and test
description: Test Java and Rust, then build the desktop and server JARs on Linux.
runs:
  using: composite
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Test Rust pathfinder (with and without JNI)
      shell: bash
      run: |
        cargo test --manifest-path native/pathfinding/Cargo.toml
        cargo test --manifest-path native/pathfinding/Cargo.toml --no-default-features

    - name: Build and bundle Linux native library
      shell: bash
      run: |
        cargo build --manifest-path native/pathfinding/Cargo.toml --release
        mkdir -p desktop/src/main/resources/native/linux-x86_64
        cp native/pathfinding/target/release/libmindustry_pathfinding.so \
          desktop/src/main/resources/native/linux-x86_64/

    - name: Run Java tests
      shell: bash
      run: |
        set -o pipefail
        ./gradlew tests:test --rerun --stacktrace 2>&1 | tee /tmp/mindustry-tests.log || {
          python3 -c 'import pathlib; lines=pathlib.Path("/tmp/mindustry-tests.log").read_text(errors="replace").splitlines(); relevant=[l for l in lines if any(x in l for x in ("error:", "symbol:", "location:", " FAILED", "AssertionFailedError", "Exception", "What went wrong", "Caused by"))]; msg="\n".join(relevant[-50:])[-12000:]; print("::error::"+msg.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
        }

    - name: Upload Java test reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: java-test-reports
        path: |
          tests/build/reports/tests/test/
          tests/build/test-results/test/
        if-no-files-found: ignore

    - name: Build desktop and server JARs
      shell: bash
      run: |
        ./gradlew desktop:dist server:dist --stacktrace
        test -f desktop/build/libs/Mindustry.jar
        test -f server/build/libs/server-release.jar

    - name: Verify experimental cave worker packaging
      shell: bash
      run: |
        set -o pipefail
        jar tf desktop/build/libs/Mindustry.jar > /tmp/mindustry-desktop-contents.txt
        grep -Fx 'mindustry/server/CavePersistentService.class' /tmp/mindustry-desktop-contents.txt
        grep -Fx 'mindustry/server/CaveSimulationWorker.class' /tmp/mindustry-desktop-contents.txt
        grep -Fx 'arc/backend/headless/HeadlessApplication.class' /tmp/mindustry-desktop-contents.txt
        set +e
        java -cp desktop/build/libs/Mindustry.jar mindustry.server.CavePersistentService > /tmp/cave-worker-smoke.log 2>&1
        status=$?
        set -e
        test "$status" -eq 2
        grep -F 'Usage: CavePersistentService' /tmp/cave-worker-smoke.log

    - name: Verify packaged JNI library
      shell: bash
      run: |
        jar tf desktop/build/libs/Mindustry.jar | grep -Fx 'native/linux-x86_64/libmindustry_pathfinding.so'
        tmpdir=$(mktemp -d)
        trap 'rm -rf "$tmpdir"' EXIT
        cat > "$tmpdir/NativeSmokeTest.java" <<'JAVA'
        import java.util.Arrays;
        import mindustry.desktop.NativeFlowfieldJNI;

        public class NativeSmokeTest{
            public static void main(String[] args){
                int[] result = NativeFlowfieldJNI.compute(new int[]{1, 5, 1, 1}, 2, 2, new int[]{0, 3});
                if(!Arrays.equals(result, new int[]{0, 5, 1, 0})){
                    throw new AssertionError("Unexpected native flowfield: " + Arrays.toString(result));
                }
            }
        }
        JAVA
        javac -cp desktop/build/libs/Mindustry.jar -d "$tmpdir" "$tmpdir/NativeSmokeTest.java"
        java -Djava.library.path="$tmpdir" -cp "desktop/build/libs/Mindustry.jar:$tmpdir" NativeSmokeTest

    - name: Upload JARs
      uses: actions/upload-artifact@v7
      with:
        name: mindustry-linux-jars
        path: |
          desktop/build/libs/Mindustry.jar
          server/build/libs/server-release.jar
        if-no-files-found: error
